<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 859" width="960" height="859" role="img" aria-labelledby="title desc">
<title id="title">academic-pipeline 系統架構</title>
<desc id="desc">研究者在最上層做確認與取捨；skills 依序執行流程站，委派 agents 判斷、執行確定性腳本 gate；所有狀態寫入 SSOT artifacts；右側進度層唯讀 artifacts，回報下一步與待裁決事項。</desc>
